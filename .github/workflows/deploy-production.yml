name: Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-deploy:
    name: Build image and deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PRODUCTION_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Compute image reference
        id: image
        run: |
          echo "ref=africa-south1-docker.pkg.dev/${{ secrets.GCP_PRODUCTION_PROJECT_ID }}/cuevolution-images/cuevolution:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and deploy with Cloud Build
        run: |
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --project="${{ secrets.GCP_PRODUCTION_PROJECT_ID }}" \
            --gcs-source-staging-dir="gs://${{ secrets.GCP_PRODUCTION_PROJECT_ID }}-cloudbuild-source/source" \
            --service-account="projects/${{ secrets.GCP_PRODUCTION_PROJECT_ID }}/serviceAccounts/cuevolution-production-cb@${{ secrets.GCP_PRODUCTION_PROJECT_ID }}.iam.gserviceaccount.com" \
            --substitutions="_IMAGE_TAG=${{ steps.image.outputs.ref }},_REGION=africa-south1,_MIGRATION_JOB=cuevolution-production-migrate,_WEB_SERVICE=cuevolution-production-web,_WORKER_SERVICE=cuevolution-production-worker"
