name: Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-deploy:
    name: Build image and deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PRODUCTION_PROJECT_ID }}
      REGION: europe-west4

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Compute image reference
        id: image
        run: |
          echo "ref=${REGION}-docker.pkg.dev/${PROJECT_ID}/cuevolution-images/cuevolution:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Service, job, instance and secret names default to the values in
      # cloudbuild.yaml. SMOKE_URL is a repository variable: empty means the
      # web service's run.app URL; set it to https://sportpesapool.ke after
      # the DNS cutover.
      - name: Build and deploy with Cloud Build
        run: |
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --default-buckets-behavior=legacy-bucket \
            --project="${PROJECT_ID}" \
            --service-account="projects/${PROJECT_ID}/serviceAccounts/cuevolution-production-cb@${PROJECT_ID}.iam.gserviceaccount.com" \
            --substitutions="_IMAGE_TAG=${{ steps.image.outputs.ref }},_REGION=${REGION},_SMOKE_URL=${{ vars.SMOKE_URL }}"
