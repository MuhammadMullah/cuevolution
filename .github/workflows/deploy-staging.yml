name: Deploy (staging)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-deploy:
    name: Build image, push to GHCR, deploy over SSH
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: image
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${repo_lower}:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "floating=ghcr.io/${repo_lower}:staging" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.floating }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # app/deploy/docker-compose.yml and app/deploy/Caddyfile are the
      # source of truth — re-synced on every deploy so server-side config
      # never silently drifts from what's committed. app/deploy/.env lives
      # only on the server (see app/deploy/README.md) and is never touched
      # here except for the IMAGE= line, updated below.
      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "app/deploy/docker-compose.yml,app/deploy/Caddyfile"
          target: "/opt/cuevolution"
          strip_components: 2

      - name: Pull image, migrate, restart
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_REF
          script: |
            set -euo pipefail
            cd /opt/cuevolution
            sed -i "s|^IMAGE=.*|IMAGE=${IMAGE_REF}|" .env
            docker compose --env-file .env pull
            docker compose --env-file .env run --rm app bin/migrate
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f
