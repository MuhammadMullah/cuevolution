name: Deploy (staging)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-deploy:
    name: Build image and deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Compute image reference
        id: image
        run: |
          echo "ref=africa-south1-docker.pkg.dev/cuevolution-staging/cuevolution-images/cuevolution:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and deploy with Cloud Build
        run: |
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --project=cuevolution-staging \
            --service-account=projects/cuevolution-staging/serviceAccounts/cuevolution-staging-cb@cuevolution-staging.iam.gserviceaccount.com \
            --substitutions="_IMAGE_TAG=${{ steps.image.outputs.ref }},_REGION=africa-south1,_MIGRATION_JOB=cuevolution-staging-migrate,_WEB_SERVICE=cuevolution-staging-web,_WORKER_SERVICE=cuevolution-staging-worker"
