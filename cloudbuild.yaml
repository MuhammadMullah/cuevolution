steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - app/Dockerfile
      - -t
      - ${_IMAGE_TAG}
      - app

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
      - IMAGE_TAG=${_IMAGE_TAG}
      - REGION=${_REGION}
      - MIGRATION_JOB=${_MIGRATION_JOB}
      - WEB_SERVICE=${_WEB_SERVICE}
      - WORKER_SERVICE=${_WORKER_SERVICE}
      - GCP_PROJECT=${PROJECT_ID}
    args:
      - -ceu
      - |
        digest="$$(gcloud artifacts docker images describe "$${IMAGE_TAG}" \
          --format='value(image_summary.digest)')"
        image_ref="$${IMAGE_TAG%:*}@$${digest}"

        gcloud run jobs update "$${MIGRATION_JOB}" \
          --project="$${GCP_PROJECT}" \
          --region="$${REGION}" \
          --image="$${image_ref}" \
          --quiet

        gcloud run jobs execute "$${MIGRATION_JOB}" \
          --project="$${GCP_PROJECT}" \
          --region="$${REGION}" \
          --wait \
          --quiet

        gcloud run services update "$${WEB_SERVICE}" \
          --project="$${GCP_PROJECT}" \
          --region="$${REGION}" \
          --image="$${image_ref}" \
          --quiet

        gcloud run services update "$${WORKER_SERVICE}" \
          --project="$${GCP_PROJECT}" \
          --region="$${REGION}" \
          --image="$${image_ref}" \
          --quiet

        url="$$(gcloud run services describe "$${WEB_SERVICE}" \
          --project="$${GCP_PROJECT}" \
          --region="$${REGION}" \
          --format='value(status.url)')"
        token="$$(gcloud auth print-identity-token --audiences="$${url}")"
        curl --fail --silent --show-error \
          --header "Authorization: Bearer $${token}" \
          "$${url}/health/readiness"

images:
  - ${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
