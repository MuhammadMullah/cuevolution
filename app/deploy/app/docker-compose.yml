# Per-environment app + database stack — the same file is deployed twice
# on the shared server (once for staging, once for production), each in
# its own directory with its own .env (see deploy/README.md). No reverse
# proxy or published ports here — deploy/caddy/ is the single shared Caddy
# instance in front of both, since two Caddy instances can't both bind
# 80/443 on one host. APP_CONTAINER_NAME must be distinct per environment
# so Caddy can address each app container unambiguously on the shared
# "web" network.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE}
    container_name: ${APP_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      web: {}
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${DOMAIN}
      PHX_SERVER: "true"
      PORT: "4000"
      POOL_SIZE: ${POOL_SIZE:-10}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      POSTMARK_SMTP_HOST: ${POSTMARK_SMTP_HOST}
      POSTMARK_SMTP_PORT: ${POSTMARK_SMTP_PORT}
      POSTMARK_SMTP_USERNAME: ${POSTMARK_SMTP_USERNAME}
      POSTMARK_SMTP_PASSWORD: ${POSTMARK_SMTP_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}

networks:
  web:
    external: true

volumes:
  postgres_data:
